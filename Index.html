<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anshcommerce: Online Shopping Site for Mobiles, Electronics, Fashion & More</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        anshBlue: '#2874f0',
                        anshYellow: '#ffe11b',
                        anshOrange: '#fb641b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Top Navigation Header -->
    <header class="bg-anshBlue sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-2 flex items-center justify-between gap-4">
            
            <!-- Logo & Brand -->
            <div class="flex items-center gap-1 cursor-pointer" onclick="filterCategory('All')">
                <div>
                    <span class="text-white font-bold italic text-2xl tracking-wider">Ansh<span class="text-anshYellow">commerce</span></span>
                    <div class="text-xs text-yellow-300 italic flex items-center gap-1">
                        Explore <span class="text-white font-semibold">Plus</span> <i class="fa-solid fa-plus text-[10px]"></i>
                    </div>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-2xl relative hidden md:block">
                <input type="text" id="search-input" onkeyup="searchProducts()" placeholder="Search for products, brands and more" class="w-full py-2 pl-4 pr-10 text-sm bg-white rounded-sm focus:outline-none shadow-inner">
                <button onclick="searchProducts()" class="absolute right-0 top-0 h-full px-4 text-anshBlue bg-white rounded-r-sm hover:bg-gray-50">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>

            <!-- Right Actions (Login, Cart, More) -->
            <div class="flex items-center gap-6 text-white font-medium">
                <button onclick="openLoginModal()" class="bg-white text-anshBlue px-8 py-1 rounded-sm font-semibold shadow hover:bg-gray-100 transition">Login</button>
                <a href="#seller" onclick="alert('Welcome to Anshcommerce Seller Hub! Registration opening soon.')" class="hidden sm:inline-block hover:text-yellow-300">Become a Seller</a>
                <a href="#more" onclick="alert('Anshcommerce 24x7 Customer Care & Notifications')" class="hidden sm:inline-block hover:text-yellow-300">More <i class="fa-solid fa-angle-down text-xs"></i></a>
                <a href="#cart" onclick="openCartDrawer()" class="flex items-center gap-2 hover:text-yellow-300 relative cursor-pointer">
                    <i class="fa-solid fa-cart-shopping text-lg"></i>
                    <span class="hidden sm:inline">Cart</span>
                    <span id="cart-count" class="bg-red-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full absolute -top-2 -right-3">0</span>
                </a>
            </div>
        </div>

        <!-- Mobile Search Bar -->
        <div class="px-4 pb-2 md:hidden">
            <div class="relative">
                <input type="text" id="mobile-search-input" onkeyup="searchProductsMobile()" placeholder="Search for products..." class="w-full py-2 pl-4 pr-10 text-sm bg-white rounded-sm focus:outline-none">
                <button class="absolute right-0 top-0 h-full px-4 text-anshBlue">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Categories Strip -->
    <nav class="bg-white shadow-sm mb-4">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center overflow-x-auto gap-8 text-sm font-semibold text-gray-800 scrollbar-none">
            <div onclick="filterCategory('Grocery')" class="flex flex-col items-center cursor-pointer hover:text-anshBlue min-w-[60px] transition transform hover:scale-105">
                <img src="https://rukminim1.flixcart.com/flap/128/128/image/21af7159a4d628da.png?q=100" alt="Grocery" class="w-12 h-12 object-contain">
                <span>Grocery</span>
            </div>
            <div onclick="filterCategory('Mobiles')" class="flex flex-col items-center cursor-pointer hover:text-anshBlue min-w-[60px] transition transform hover:scale-105">
                <img src="https://rukminim1.flixcart.com/flap/128/128/image/698ba082468ab36p.png?q=100" alt="Mobiles" class="w-12 h-12 object-contain">
                <span>Mobiles</span>
            </div>
            <div onclick="filterCategory('Fashion')" class="flex flex-col items-center cursor-pointer hover:text-anshBlue min-w-[60px] transition transform hover:scale-105">
                <img src="https://rukminim1.flixcart.com/flap/128/128/image/ab7e2b022a4587df.jpg?q=100" alt="Fashion" class="w-12 h-12 object-contain">
                <span>Fashion</span>
            </div>
            <div onclick="filterCategory('Electronics')" class="flex flex-col items-center cursor-pointer hover:text-anshBlue min-w-[60px] transition transform hover:scale-105">
                <img src="https://rukminim1.flixcart.com/flap/128/128/image/0ff199d1bd27eb98.png?q=100" alt="Electronics" class="w-12 h-12 object-contain">
                <span>Electronics</span>
            </div>
            <div onclick="filterCategory('Home')" class="flex flex-col items-center cursor-pointer hover:text-anshBlue min-w-[60px] transition transform hover:scale-105">
                <img src="https://rukminim1.flixcart.com/flap/128/128/image/71050627a56b4693.png?q=100" alt="Home" class="w-12 h-12 object-contain">
                <span>Home</span>
            </div>
            <div onclick="filterCategory('Beauty')" class="flex flex-col items-center cursor-pointer hover:text-anshBlue min-w-[60px] transition transform hover:scale-105">
                <img src="https://rukminim1.flixcart.com/flap/128/128/image/dff3f7adcf3a90c6.png?q=100" alt="Beauty" class="w-12 h-12 object-contain">
                <span>Beauty</span>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 space-y-4 pb-12">

        <!-- Hero Banner Carousel Simulation -->
        <div class="bg-white rounded shadow-sm overflow-hidden relative">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-800 text-white p-8 md:p-12 flex flex-col md:flex-row items-center justify-between">
                <div class="space-y-4 max-w-lg text-center md:text-left">
                    <span class="bg-anshYellow text-gray-900 text-xs font-bold px-2.5 py-1 rounded">ANSHCOMMERCE MEGA SALE</span>
                    <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight">Super Electronics & Styles at Best Prices</h1>
                    <p class="text-blue-100 text-sm">Experience next-generation e-commerce with lightning-fast delivery and top brand quality.</p>
                    <button onclick="filterCategory('Electronics')" class="bg-anshYellow text-gray-900 font-bold px-6 py-
